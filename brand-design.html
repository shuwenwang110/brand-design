<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand Design - Shuwen Wang Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="white-spider.css" />
  <script src="libraries/p5.min.js" defer></script>
  <script src="space-effects.js" defer></script>
  <script src="white-spider.js" defer></script>
  <script src="protect-media.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <nav class="top-nav" aria-label="Page navigation">
      <a class="back-link" href="https://shuwenwang110.github.io/Portfolio/" data-transition>Back to portfolio</a>
      <p class="page-explain">A brand design project developed around Sony, exploring how a visual identity can extend across packaging, posters, public advertising, and environmental mockups.</p>
    </nav>
    <section class="project-hero">
      <div>
        <p class="eyebrow">Graphic design</p>
        <h1 class="project-title">Brand Design</h1>
      </div>
    </section>

    <section class="brand-lead" aria-label="Brand system design boards">
      <figure class="work-frame">
        <img src="brand-design/Design.png" alt="Brand system design board 1" loading="eager" />
        <figcaption><span>Brand Design</span><span>Design 01</span></figcaption>
      </figure>
      <figure class="work-frame">
        <img src="brand-design/Design2.png" alt="Brand system design board 2" loading="lazy" />
        <figcaption><span>Brand Design</span><span>Design 02</span></figcaption>
      </figure>
    </section>

    <section class="brand-mockups" aria-label="Brand system mockups">
      <figure class="work-frame"><img src="brand-design/Corrugated_Box_Mockup_4.png" alt="Corrugated box mockup 1" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Corrugated_Box_Mockup_4.2.png" alt="Corrugated box mockup 2" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Corrugated_Box_Mockup_5.png" alt="Corrugated box mockup 3" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Corrugated_Box_Mockup_5.2.png" alt="Corrugated box mockup 4" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Sliding_Drawer_Box_Mockup_3.png" alt="Sliding drawer box mockup 1" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Sliding_Drawer_Box_Mockup_3.2.png" alt="Sliding drawer box mockup 2" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Sliding_Drawer_Box_Mockup_6.png" alt="Sliding drawer box mockup 3" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Sliding_Drawer_Box_Mockup_6.2.png" alt="Sliding drawer box mockup 4" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Free_Billboard_Sign_Mockup_1.png" alt="Billboard mockup 1" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Free_Billboard_Sign_Mockup_2.png" alt="Billboard mockup 2" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Free_Billboard_Sign_Mockup_22.png" alt="Billboard mockup 3" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Subway_Billboard_Mockup_1.png" alt="Subway billboard mockup 1" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Subway_Billboard_Mockup_1.2.png" alt="Subway billboard mockup 2" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Large_City_Banner_Mockup.png" alt="Large city banner mockup 1" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Large_City_Banner_Mockup2.png" alt="Large city banner mockup 2" loading="lazy" /></figure>
      <figure class="work-frame"><img src="brand-design/Three_Hanging_Banners_Mockup.png" alt="Three hanging banners mockup" loading="lazy" /></figure>
    </section>

    <section class="brand-final" aria-label="Brand system final design">
      <figure class="work-frame">
        <img src="brand-design/Design 22.png" alt="Brand system final design board" loading="lazy" />
        <figcaption><span>Brand Design</span><span>Design 22</span></figcaption>
      </figure>
    </section>

    <a class="bottom-back-link" href="https://shuwenwang110.github.io/Portfolio/" data-transition>Back to portfolio</a>
  </main>
  <div class="fade-screen" aria-hidden="true"></div>
  <script>
    document.querySelectorAll("[data-transition]").forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        document.body.classList.add("is-leaving");
        setTimeout(() => {
          window.location.href = link.href;
        }, 520);
      });
    });
  </script>
</body>
</html>
