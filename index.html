  <div class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image preview" tabindex="-1">
    <img class="lightbox-image" src="" alt="" />
  </div>
  <div class="fade-screen" aria-hidden="true"></div>
  <script>
    const lightbox = document.querySelector('.lightbox');
    const lightboxImage = document.querySelector('.lightbox-image');
    let lastCard;
    document.querySelectorAll('#everpeakGallery .click-card').forEach(card => {
      card.addEventListener('click', () => {
        lastCard = card;
        lightboxImage.src = card.dataset.full;
        lightboxImage.alt = card.querySelector('img').alt;
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.classList.add('lightbox-open');
        lightbox.focus();
      });
    });
    function closeLightbox() {
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('lightbox-open');
      if (lastCard) lastCard.focus();
    }
    lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', event => {
      if (lightbox.getAttribute('aria-hidden') === 'true') return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'Tab') { event.preventDefault(); lightbox.focus(); }
    });

    document.querySelectorAll("[data-transition]").forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        document.body.classList.add("is-leaving");
        setTimeout(() => {
          window.location.href = link.href;
        }, 520);
      });
    });
  </script>
